# Public-wallet copy-trading research alpha.  It is intentionally paper-only.
mode: paper

source:
  venue: hyperliquid
  network: mainnet
  info_url: https://api.hyperliquid.xyz/info
  websocket_url: wss://api.hyperliquid.xyz/ws
  request_timeout_seconds: 20
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 30
  stale_after_seconds: 60
  subscribe_order_updates: false
  subscribe_position_state: true
  subscribe_market_data: true

# Phase D.4 is opt-in, public-account observation only.  This setting cannot
# enable trading, signing, submissions, cancellations, or live copy mode.
shadow_observation:
  enabled: false
  venue: hyperliquid
  account_id: ""
  max_age_seconds: 60.0

# Optionally list manually researched wallets.  Importing a CSV is usually
# preferable so this example remains non-prescriptive.
targets: []

capital:
  initial_capital: 200.00
  currency: USD

sizing:
  mode: ratio
  small_fraction: 0.05
  medium_fraction: 0.10
  large_fraction: 0.20
  small_ratio_max: 0.67
  large_ratio_min: 1.50
  min_history: 10
  fallback_fraction: 0.10
  quantiles: [0.33, 0.67]
  copy_initial_entries: true
  copy_target_adds: false
  max_equity_age_seconds: 300
  accepted_equity_sources: [exact, recent_live_snapshot, sampled_prior_proxy]

risk:
  max_total_committed_fraction: 0.80
  max_capital_per_target_fraction: 0.30
  max_capital_per_symbol_fraction: 0.40
  max_simultaneous_virtual_campaigns: 7
  daily_loss_stop_fraction: 0.10
  target_loss_stop_fraction: 0.15
  max_copy_drawdown_fraction: 0.20
  max_consecutive_losses: 5
  kill_switch_path: state/copytrade_kill_switch.txt
  max_signal_age_seconds: 30
  max_price_deviation_bps: 50
  insufficient_capital_action: scale
  symbol_allowlist: []
  symbol_blocklist: []
  max_leverage: null
  risk_cap_base: current_equity

paper_execution:
  min_order_notional: 10
  quantity_precision: 6
  missed_trade_rate: 0
  random_seed: 7
  market_data_max_age_ms: 3000
  mark_persist_interval_ms: 1000
  stale_exit_market_policy: target_fill_fallback

fees:
  paper_fee_rate: 0.00045

slippage:
  paper_bps: 5

latency:
  detection_ms: 250
  order_ms: 100

backtest:
  detection_delays_ms: [100, 250, 500, 1000, 2000, 5000, 15000]
  slippage_scenarios_bps: [0, 1, 2, 5, 10, 25]
  training_windows_days: [30, 60, 90, 180]
  forward_windows_days: [7, 14, 30]
  default_training_days: 90
  default_forward_days: 30

candidates:
  history_days_min: 90
  history_days_preferred: 180
  closed_campaigns_min: 100
  max_drawdown_preferred: 0.15
  max_drawdown_hard: 0.25
  max_follower_drawdown_preferred: 0.15
  max_follower_drawdown_hard: 0.30
  liquidation_frequency_hard: 0.10
  minimum_copyability_hard: 0.05
  pnl_concentration_preferred: 0.50
  pnl_concentration_hard: 0.95
  profit_factor_preferred: 1.40
  require_positive_expectancy: true
  require_positive_follower_expectancy: true
  activity_max_age_days: 30
  require_proven_history: false

# Stage A.2 gates run before expensive public historical acquisition. Zero keeps
# a dimension informational while preserving it in the discovery evidence.
prefilter:
  min_activity_observations: 2
  min_distinct_active_days: 1
  min_distinct_active_hours: 1
  min_observation_span_hours: 0
  min_observed_notional: 0
  min_distinct_symbols: 1
  exclude_operator_managed: true

confidence:
  closed_campaigns_reference: 100
  active_days_reference: 30
  history_days_reference: 180
  walk_forward_windows_reference: 4
  # Directional and volatility are the two independent regime dimensions.
  regimes_reference: 2

regimes:
  enabled: true
  volatility_move_threshold: 0.03
  minimum_campaigns_per_regime: 3

# Finalist selection is stricter than the exploratory per-wallet estimate.
# These gates never overwrite the stored Phase-B suitability score.
finalist_requirements:
  minimum_confidence_score: 60
  require_copyability_evidence: true
  require_walk_forward_evidence: false
  require_latency_evidence: false
  require_regime_evidence: false

# Phase B candidate-analysis orchestration remains public-data research only.
analysis:
  default_workers: 4
  retry_attempts: 3
  retry_initial_seconds: 0.25
  # Shared process-wide operating budget for the public /info endpoint.
  api_weight_budget_per_minute: 900
  rate_limit_backoff_initial_seconds: 2.0
  rate_limit_backoff_max_seconds: 30.0
  rate_limit_jitter_seconds: 0.5
  history_days: 180
  min_discovery_activity: 2
  shadow_finalist_count: 20
  walk_forward_min_windows: 2
  high_suitability_score: 70
  # Public one-minute candle-close evidence is an immutable coarse proxy, not L2.
  market_evidence_enabled: true
  market_evidence_bucket_seconds: 60

storage:
  # Environment overrides: BEELZEBUB_HOME, BEELZEBUB_HOT_ROOT, BEELZEBUB_COLD_ROOT.
  # Windows deployment roots: active state stays on E:, archival state stays on D:.
  hot_root: runtime/hot
  cold_root: D:/BeelzebubData
  archive_spool_max_bytes: 536870912
  archive_spool_max_age_seconds: 604800

scientific_execution:
  # Raw wallet actions are observations only. Until an independently
  # validated model route is attached, they record a scientific skip decision.
  enabled: true
  max_position_age_seconds: 600
  entry_min_effective_confidence: 0.60
  exit_effective_confidence: 0.52

artifacts: {}

database:
  path: runtime/hot/copytrade.sqlite3

obsidian:
  root: D:/BeelzebubData/obsidian

dashboard:
  host: 127.0.0.1
  port: 8090

# Merely setting these fields does not enable live operation.  The process
# rejects live startup unless both COPYTRADE_MODE=live and
# COPYTRADE_LIVE_ENABLED=true are supplied, and this alpha has no live adapter.
future_live_execution:
  enabled: false
