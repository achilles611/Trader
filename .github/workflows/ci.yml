name: CI

"on":
  push: {}
  pull_request: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install locked runtime dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile Python source
        run: python -m compileall -q src main.py beez_console.py
      - name: Run complete backend suite
        run: python -m unittest discover -s tests -v
      - name: Verify F5 governance registry offline
        run: |
          python -m src.governance.cli validate --root . --offline
          python -m src.governance.cli inventory --root . --check
          python -m src.governance.cli audit-boundaries --root . --check
          python -m src.governance.cli audit-retention --root . --check
          python -m src.governance.cli report --root . --check

  windows-backend:
    runs-on: windows-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install locked runtime dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile Python source
        run: python -m compileall -q src main.py beez_console.py
      - name: Run complete Windows backend and launcher suite
        run: python -m unittest discover -s tests -v
      - name: Verify F5 governance registry offline
        run: |
          python -m src.governance.cli validate --root . --offline
          python -m src.governance.cli inventory --root . --check
          python -m src.governance.cli audit-boundaries --root . --check
          python -m src.governance.cli audit-retention --root . --check
          python -m src.governance.cli report --root . --check

  control-center-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-center-ui
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # actions/setup-node v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control-center-ui/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run complete frontend suite
        run: npm test -- --run
      - name: Build production frontend
        run: npm run build
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Audit development tooling for High/Critical advisories
        run: npm audit --audit-level=high
